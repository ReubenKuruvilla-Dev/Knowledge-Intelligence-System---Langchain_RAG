<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Knowledge Intelligence System — Upload documents and ask AI-powered questions using RAG.">
    <title>Knowledge Intelligence System</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Animated background blobs -->
    <div class="bg-blob blob-1"></div>
    <div class="bg-blob blob-2"></div>
    <div class="bg-blob blob-3"></div>

    <div class="app-container">

        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <svg width="36" height="36" viewBox="0 0 36 36" fill="none">
                    <rect width="36" height="36" rx="10" fill="url(#logo-grad)"/>
                    <path d="M10 18L16 12L22 18L16 24Z" fill="white" opacity="0.9"/>
                    <path d="M14 18L20 12L26 18L20 24Z" fill="white" opacity="0.6"/>
                    <defs>
                        <linearGradient id="logo-grad" x1="0" y1="0" x2="36" y2="36">
                            <stop stop-color="#6C5CE7"/>
                            <stop offset="1" stop-color="#a29bfe"/>
                        </linearGradient>
                    </defs>
                </svg>
                <h1>Knowledge Intelligence</h1>
            </div>
            <p class="subtitle">Upload documents & ask AI-powered questions</p>
        </header>

        <!-- Main Content Grid -->
        <main class="main-grid">

            <!-- Upload Card -->
            <section class="card upload-card">
                <div class="card-header">
                    <div class="card-icon upload-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                    </div>
                    <h2>Upload Document</h2>
                </div>

                <form id="upload-form" enctype="multipart/form-data">
                    <div class="file-drop-zone" id="drop-zone">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="drop-icon">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="12" y1="18" x2="12" y2="12"/>
                            <polyline points="9 15 12 12 15 15"/>
                        </svg>
                        <p class="drop-text">Drag & drop your file here</p>
                        <p class="drop-hint">or click to browse — PDF and TXT supported</p>
                        <input type="file" id="file-input" name="file" accept=".pdf,.txt" hidden>
                    </div>

                    <div class="file-info" id="file-info" style="display: none;">
                        <span class="file-name" id="file-name"></span>
                        <button type="button" class="btn-clear" id="clear-file" title="Remove file">&times;</button>
                    </div>

                    <button type="submit" class="btn btn-primary btn-upload" id="upload-btn" disabled>
                        <span class="btn-text">Upload & Index</span>
                        <span class="btn-loader" style="display:none;"></span>
                    </button>
                </form>

                <div class="status-message" id="upload-status"></div>
            </section>

            <!-- Query Card -->
            <section class="card query-card">
                <div class="card-header">
                    <div class="card-icon query-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                        </svg>
                    </div>
                    <h2>Ask a Question</h2>
                </div>

                <form id="query-form">
                    <div class="textarea-wrapper">
                        <textarea id="question-input" placeholder="Type your question about the uploaded documents..." rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-ask" id="ask-btn" disabled>
                        <span class="btn-text">Ask AI</span>
                        <span class="btn-loader" style="display:none;"></span>
                    </button>
                </form>

                <!-- Response Area -->
                <div class="response-area" id="response-area" style="display: none;">
                    <div class="response-header">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                        </svg>
                        <span>AI Response</span>
                    </div>
                    <div class="response-content" id="response-content"></div>
                </div>
            </section>

        </main>

        <!-- Chat History -->
        <section class="card chat-card" id="chat-card" style="display: none;">
            <div class="card-header">
                <div class="card-icon chat-icon">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                    </svg>
                </div>
                <h2>Conversation</h2>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
        </section>

        <footer class="app-footer">
            <p>Powered by LangChain &middot; OpenAI &middot; ChromaDB</p>
        </footer>
    </div>

    <script>
        // =====================================================================
        // DOM References
        // =====================================================================
        const dropZone      = document.getElementById('drop-zone');
        const fileInput      = document.getElementById('file-input');
        const fileInfo       = document.getElementById('file-info');
        const fileName       = document.getElementById('file-name');
        const clearFileBtn   = document.getElementById('clear-file');
        const uploadForm     = document.getElementById('upload-form');
        const uploadBtn      = document.getElementById('upload-btn');
        const uploadStatus   = document.getElementById('upload-status');

        const queryForm      = document.getElementById('query-form');
        const questionInput  = document.getElementById('question-input');
        const askBtn         = document.getElementById('ask-btn');
        const responseArea   = document.getElementById('response-area');
        const responseContent= document.getElementById('response-content');

        const chatCard       = document.getElementById('chat-card');
        const chatMessages   = document.getElementById('chat-messages');

        // =====================================================================
        // File Upload — Drag & Drop + Click
        // =====================================================================
        dropZone.addEventListener('click', () => fileInput.click());

        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelected();
            }
        });

        fileInput.addEventListener('change', handleFileSelected);

        clearFileBtn.addEventListener('click', () => {
            fileInput.value = '';
            fileInfo.style.display = 'none';
            dropZone.style.display = 'flex';
            uploadBtn.disabled = true;
        });

        function handleFileSelected() {
            const file = fileInput.files[0];
            if (!file) return;
            fileName.textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
            fileInfo.style.display = 'flex';
            dropZone.style.display = 'none';
            uploadBtn.disabled = false;
        }

        // =====================================================================
        // Upload Form Submission
        // =====================================================================
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const file = fileInput.files[0];
            if (!file) return;

            setLoading(uploadBtn, true);
            uploadStatus.className = 'status-message';
            uploadStatus.textContent = '';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();

                if (res.ok) {
                    uploadStatus.classList.add('status-success');
                    uploadStatus.textContent = `✓ ${data.message} — ${data.chunks_processed} chunks indexed.`;
                } else {
                    uploadStatus.classList.add('status-error');
                    uploadStatus.textContent = `✗ ${data.error}`;
                }
            } catch (err) {
                uploadStatus.classList.add('status-error');
                uploadStatus.textContent = `✗ Network error: ${err.message}`;
            } finally {
                setLoading(uploadBtn, false);
            }
        });

        // =====================================================================
        // Query Form Submission
        // =====================================================================
        questionInput.addEventListener('input', () => {
            askBtn.disabled = questionInput.value.trim() === '';
        });

        queryForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const question = questionInput.value.trim();
            if (!question) return;

            setLoading(askBtn, true);
            responseArea.style.display = 'none';

            // Show chat history
            chatCard.style.display = 'block';
            addChatBubble(question, 'user');

            try {
                const res = await fetch('/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question })
                });
                const data = await res.json();

                if (res.ok) {
                    responseArea.style.display = 'block';
                    responseContent.textContent = data.response;
                    addChatBubble(data.response, 'ai');
                } else {
                    responseArea.style.display = 'block';
                    responseContent.textContent = `Error: ${data.error}`;
                }
            } catch (err) {
                responseArea.style.display = 'block';
                responseContent.textContent = `Network error: ${err.message}`;
            } finally {
                setLoading(askBtn, false);
                questionInput.value = '';
                askBtn.disabled = true;
            }
        });

        // =====================================================================
        // Helpers
        // =====================================================================
        function setLoading(btn, loading) {
            const text = btn.querySelector('.btn-text');
            const loader = btn.querySelector('.btn-loader');
            btn.disabled = loading;
            text.style.display = loading ? 'none' : 'inline';
            loader.style.display = loading ? 'inline-block' : 'none';
        }

        function addChatBubble(text, sender) {
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${sender}`;
            bubble.innerHTML = `<span class="chat-sender">${sender === 'user' ? 'You' : 'AI'}</span><p>${text}</p>`;
            chatMessages.appendChild(bubble);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
